[project]
name = "inquiry-desk"
version = "0.1.0"
description = "Evidence-grounded Korean support desk portfolio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "qdrant-client>=1.14,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
